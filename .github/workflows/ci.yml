name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check for committed secrets
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::A Google API key is committed. Keep keys in local.properties."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(google-services\.json|local\.properties)$'; then
            echo "::error::Configuration files that hold secrets must not be committed."
            exit 1
          fi

      - name: Validate Gradle wrapper
        run: |
          version=$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test, lint and build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Check that the Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            git diff app/schemas
            echo "::error::The exported Room schema changed; commit the files in app/schemas."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cv-pass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
